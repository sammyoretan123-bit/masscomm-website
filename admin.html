<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
    
    .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .tab-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: #eee; color: #333; transition: 0.2s; }
    .tab-btn.active { background: #6a0dad; color: #fff; }
    
    .admin-form { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #6a0dad; display: none; }
    .admin-form.active { display: block; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
    
    .btn-save { background: #1e7e34; color: #fff; padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
    .btn-save:hover { background: #155d27; }
    .status-msg { text-align: center; font-weight: bold; margin-top: 15px; }
    
    /* Manage Courses List */
    .course-list-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #6a0dad; }
    .course-list-item h4 { margin: 0 0 5px; color: #333; }
    .course-list-item p { margin: 0; color: #666; font-size: 0.9rem; }
    .action-btns { display: flex; gap: 10px; }
    .btn-edit { background: #ffc107; color: #000; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-delete { background: #e50914; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    /* Students Table */
    .student-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .student-table th { text-align: left; padding: 12px; background: #f4f6f9; color: #333; border-bottom: 2px solid #ddd; }
    .student-table td { padding: 12px; border-bottom: 1px solid #eee; color: #555; }
    .student-table tr:hover { background: #fafafa; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; background: #e0e0e0; color: #333; }

    .nav-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #6a0dad; vertical-align: middle; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/mass communication logo.jpg" alt="Logo" />
        <span>Mass Communication AAUA</span>
      </div>
      
      <!-- Added id="navLinks" here -->
      <ul class="nav-links" id="navLinks">
        <li><a href="dashboard.html">My Dashboard</a></li>
        <li><a href="admin.html" style="color: #e50914; font-weight: bold;">Admin Panel</a></li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
      
      <!-- Added the hamburger icon here -->
      <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    </nav>
  </header>

  <div class="admin-container">
    <h1 style="color: #0d0d0d; margin-bottom: 20px;">Admin Dashboard</h1>
    
    <div class="admin-tabs">
      <button class="tab-btn active" onclick="switchTab('course', this)">Add Course</button>
      <button class="tab-btn" onclick="switchTab('lesson', this)">Add Lesson</button>
      <button class="tab-btn" onclick="switchTab('quiz', this)">Add Quiz Question</button>
      <button class="tab-btn" onclick="switchTab('manage', this)">Manage Courses</button>
      <button class="tab-btn" onclick="switchTab('students', this)">Enrolled Students</button>
    </div>

    <div id="form-course" class="admin-form active">
      <h3 style="color: #6a0dad; margin-top: 0;">Add a New Course</h3>
      <div class="form-group"><label>Course Code (e.g., MAC 101)</label><input type="text" id="course-code" placeholder="MAC 101" /></div>
      <div class="form-group"><label>Course Title</label><input type="text" id="course-title" placeholder="Introduction to Communication" /></div>
      <div class="form-group"><label>Description</label><textarea id="course-desc" rows="3" placeholder="Short description..."></textarea></div>
      <button class="btn-save" onclick="addCourse()">Add Course</button>
      <p id="msg-course" class="status-msg"></p>
    </div>

    <div id="form-lesson" class="admin-form">
      <h3 style="color: #6a0dad; margin-top: 0;">Add a Lesson</h3>
      <div class="form-group"><label>Course Code</label><input type="text" id="lesson-code" placeholder="MAC 101" /></div>
      <div class="form-group"><label>Lesson Title</label><input type="text" id="lesson-title" placeholder="Week 1: Basics" /></div>
      <div class="form-group"><label>Order Index (1, 2, 3...)</label><input type="number" id="lesson-order" placeholder="1" /></div>
      <div class="form-group"><label>PDF File URL (Optional)</label><input type="text" id="lesson-pdf" placeholder="https://..." /></div>
      <div class="form-group"><label>Video Embed URL (Optional)</label><input type="text" id="lesson-video" placeholder="https://www.youtube.com/embed/..." /></div>
      <div class="form-group"><label>Description / Notes</label><textarea id="lesson-desc" rows="3" placeholder="Write the lesson text here..."></textarea></div>
      <button class="btn-save" onclick="addLesson()">Add Lesson</button>
      <p id="msg-lesson" class="status-msg"></p>
    </div>

    <div id="form-quiz" class="admin-form">
      <h3 style="color: #6a0dad; margin-top: 0;">Add a Quiz Question</h3>
      <div class="form-group"><label>Course Code</label><input type="text" id="quiz-code" placeholder="MAC 101" /></div>
      <div class="form-group"><label>Question</label><input type="text" id="quiz-question" placeholder="What is...?" /></div>
      <div class="form-group"><label>Option A</label><input type="text" id="quiz-a" /></div>
      <div class="form-group"><label>Option B</label><input type="text" id="quiz-b" /></div>
      <div class="form-group"><label>Option C</label><input type="text" id="quiz-c" /></div>
      <div class="form-group"><label>Option D</label><input type="text" id="quiz-d" /></div>
      <div class="form-group"><label>Correct Answer</label><select id="quiz-correct"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select></div>
      <button class="btn-save" onclick="addQuiz()">Add Question</button>
      <p id="msg-quiz" class="status-msg"></p>
    </div>

    <div id="form-manage" class="admin-form">
      <h3 style="color: #6a0dad; margin-top: 0;">Manage Courses</h3>
      <div id="manage-list"><p>Loading courses...</p></div>
    </div>

    <div id="form-students" class="admin-form">
      <h3 style="color: #6a0dad; margin-top: 0;">Enrolled Students</h3>
      <p style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Students who have completed at least one lesson.</p>
      <div id="students-list">
        <p>Loading students...</p>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // --- SECURITY CHECK ---
    async function checkAdmin() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }

      const { data: profile } = await supabaseClient.from('profiles').select('role').eq('id', session.user.id).single();
      if (!profile || profile.role !== 'admin') {
        alert("Access Denied: You are not an administrator.");
        window.location.href = "dashboard.html";
      }
    }
    checkAdmin();

    // --- MANUAL MOBILE MENU TOGGLE ---
    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    // --- TAB SWITCHING ---
    function switchTab(tabName, btnElement) {
      document.querySelectorAll('.admin-form').forEach(f => f.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById('form-' + tabName).classList.add('active');
      if(btnElement) btnElement.classList.add('active');

      if (tabName === 'manage') { loadManageList(); }
      if (tabName === 'students') { loadStudents(); }
    }

    // --- FORM SUBMISSIONS ---
    async function addCourse() {
      const code = document.getElementById('course-code').value;
      const title = document.getElementById('course-title').value;
      const desc = document.getElementById('course-desc').value;
      const msg = document.getElementById('msg-course');

      if (!code || !title) { msg.style.color = 'red'; msg.textContent = 'Code and Title are required.'; return; }

      msg.style.color = 'blue'; msg.textContent = 'Saving...';
      const { error } = await supabaseClient.from('courses').insert([{ code, title, description: desc }]);

      if (error) { msg.style.color = 'red'; msg.textContent = 'Error: ' + error.message; }
      else { msg.style.color = 'green'; msg.textContent = '✅ Course added successfully!'; document.getElementById('course-code').value = ''; document.getElementById('course-title').value = ''; document.getElementById('course-desc').value = ''; }
    }

    async function addLesson() {
      const code = document.getElementById('lesson-code').value;
      const title = document.getElementById('lesson-title').value;
      const order = document.getElementById('lesson-order').value;
      const pdf = document.getElementById('lesson-pdf').value;
      const video = document.getElementById('lesson-video').value;
      const desc = document.getElementById('lesson-desc').value;
      const msg = document.getElementById('msg-lesson');

      if (!code || !title) { msg.style.color = 'red'; msg.textContent = 'Code and Title are required.'; return; }

      msg.style.color = 'blue'; msg.textContent = 'Saving...';
      const { error } = await supabaseClient.from('materials').insert([{ 
        course_code: code, title: title, order_index: parseInt(order) || 0, file_url: pdf, video_url: video, description: desc 
      }]);

      if (error) { msg.style.color = 'red'; msg.textContent = 'Error: ' + error.message; }
      else { msg.style.color = 'green'; msg.textContent = '✅ Lesson added successfully!'; document.getElementById('lesson-title').value = ''; }
    }

    async function addQuiz() {
      const code = document.getElementById('quiz-code').value;
      const question = document.getElementById('quiz-question').value;
      const a = document.getElementById('quiz-a').value;
      const b = document.getElementById('quiz-b').value;
      const c = document.getElementById('quiz-c').value;
      const d = document.getElementById('quiz-d').value;
      const correct = document.getElementById('quiz-correct').value;
      const msg = document.getElementById('msg-quiz');

      if (!code || !question || !a || !b || !c || !d) { msg.style.color = 'red'; msg.textContent = 'All fields are required.'; return; }

      msg.style.color = 'blue'; msg.textContent = 'Saving...';
      const { error } = await supabaseClient.from('quizzes').insert([{ 
        course_code: code, question: question, option_a: a, option_b: b, option_c: c, option_d: d, correct_answer: correct 
      }]);

      if (error) { msg.style.color = 'red'; msg.textContent = 'Error: ' + error.message; }
      else { msg.style.color = 'green'; msg.textContent = '✅ Question added successfully!'; document.getElementById('quiz-question').value = ''; }
    }

    // --- MANAGE COURSES (EDIT/DELETE) ---
    async function loadManageList() {
      const listContainer = document.getElementById('manage-list');
      listContainer.innerHTML = '<p>Loading...</p>';

      const { data: courses, error } = await supabaseClient.from('courses').select('*').order('title');
      
      if (error || !courses) { listContainer.innerHTML = '<p style="color:red;">Error loading courses.</p>'; return; }
      if (courses.length === 0) { listContainer.innerHTML = '<p>No courses found.</p>'; return; }

      listContainer.innerHTML = courses.map(course => `
        <div class="course-list-item">
          <div>
            <h4>${course.title} <span style="font-weight:normal; color:#6a0dad;">(${course.code})</span></h4>
            <p>${course.description || 'No description'}</p>
          </div>
          <div class="action-btns">
            <button class="btn-edit" onclick="editCourse(${course.id}, '${course.code}', '${course.title.replace(/'/g, "\\'")}', '${(course.description || '').replace(/'/g, "\\'")}')">✏️ Edit</button>
            <button class="btn-delete" onclick="deleteCourse(${course.id})">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteCourse(courseId) {
      if (!confirm("Are you sure you want to delete this course? This might break student progress if they are enrolled.")) return;

      const { error } = await supabaseClient.from('courses').delete().eq('id', courseId);
      
      if (error) { alert("Error deleting: " + error.message); }
      else { alert("Course deleted successfully."); loadManageList(); }
    }

    function editCourse(id, oldCode, oldTitle, oldDesc) {
      switchTab('course', document.querySelector('.tab-btn'));
      document.getElementById('course-code').value = oldCode;
      document.getElementById('course-title').value = oldTitle;
      document.getElementById('course-desc').value = oldDesc;

      const saveBtn = document.querySelector('#form-course .btn-save');
      saveBtn.textContent = "Update Course";
      saveBtn.style.background = '#ffc107';
      saveBtn.style.color = '#000';
      
      saveBtn.onclick = async () => {
        const newCode = document.getElementById('course-code').value;
        const newTitle = document.getElementById('course-title').value;
        const newDesc = document.getElementById('course-desc').value;
        const msg = document.getElementById('msg-course');

        msg.style.color = 'blue'; msg.textContent = 'Updating...';
        const { error } = await supabaseClient.from('courses').update({ code: newCode, title: newTitle, description: newDesc }).eq('id', id);
        
        if (error) { msg.style.color = 'red'; msg.textContent = 'Error: ' + error.message; }
        else { 
          msg.style.color = 'green'; msg.textContent = '✅ Course updated successfully!'; 
          saveBtn.textContent = "Add Course"; saveBtn.style.background = '#1e7e34'; saveBtn.style.color = '#fff'; saveBtn.onclick = addCourse;
          document.getElementById('course-code').value = ''; document.getElementById('course-title').value = ''; document.getElementById('course-desc').value = '';
        }
      };
    }

    // --- ENROLLED STUDENTS TRACKER ---
    async function loadStudents() {
      const listContainer = document.getElementById('students-list');
      listContainer.innerHTML = '<p>Loading student data...</p>';

      const { data: progress, error: progErr } = await supabaseClient.from('progress').select('user_id, material_id');
      const { data: profiles, error: profErr } = await supabaseClient.from('profiles').select('id, full_name');
      const { data: materials, error: matErr } = await supabaseClient.from('materials').select('id, course_code');
      
      if (progErr || profErr || matErr) { listContainer.innerHTML = '<p style="color:red;">Error loading data.</p>'; return; }
      if (!progress || progress.length === 0) { listContainer.innerHTML = '<p>No students have completed any lessons yet.</p>'; return; }

      const studentStats = {};

      progress.forEach(record => {
        const profile = profiles.find(p => String(p.id) === String(record.user_id));
        const name = (profile && profile.full_name) ? profile.full_name : "Unknown Student";

        const material = materials.find(m => m.id === record.material_id);
        const courseCode = material ? material.course_code : "Unknown Course";

        const key = `${record.user_id}-${courseCode}`;

        if (!studentStats[key]) {
          studentStats[key] = { name: name, course: courseCode, count: 0 };
        }
        studentStats[key].count += 1;
      });

      const statsArray = Object.values(studentStats);

      listContainer.innerHTML = `
        <table class="student-table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Course Code</th>
              <th>Lessons Completed</th>
            </tr>
          </thead>
          <tbody>
            ${statsArray.map(stat => `
              <tr>
                <td><strong>${stat.name}</strong></td>
                <td><span class="badge">${stat.course}</span></td>
                <td>${stat.count}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });
  </script>

  <!-- FORCED CSS FOR MOBILE MENU (Bypasses style.css) -->
  <style>
    @media screen and (max-width: 768px) {
      .menu-toggle {
        display: block !important;
        color: #fff !important;
        font-size: 28px !important;
        cursor: pointer !important;
        z-index: 9999 !important;
      }
      .nav-links {
        display: none !important; 
        position: absolute !important;
        top: 70px !important;
        right: 20px !important;
        background: #000 !important;
        width: 220px !important;
        flex-direction: column !important;
        padding: 20px !important;
        border-radius: 8px !important;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5) !important;
        z-index: 9998 !important;
      }
      .nav-links.active {
        display: flex !important; 
      }
      .nav-links li {
        margin: 12px 0 !important;
        text-align: right !important;
        width: 100% !important;
        display: block !important;
      }
      .nav-links a {
        display: block !important;
        width: 100% !important;
        color: #fff !important;
        padding: 10px 0 !important;
        text-decoration: none !important;
      }
    }
  </style>
</body>
</html>
