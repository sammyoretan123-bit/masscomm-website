<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course View | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    .course-header { background: linear-gradient(135deg, #0d0214 0%, #2a0845 100%); padding: 60px 20px; text-align: center; color: #fff; border-bottom: 2px solid #6a0dad; }
    .course-header h1 { font-size: 3rem; margin-bottom: 10px; }
    .course-header p { color: #e0d4eb; font-size: 1.2rem; max-width: 800px; margin: 0 auto; }
    
    .materials-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .lesson-item { display: flex; flex-direction: column; background: #fff; padding: 30px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #6a0dad; }
    
    .lesson-header { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    .lesson-header h3 { margin: 0 0 5px; color: #0d0d0d; font-size: 1.5rem; }
    .lesson-header p { margin: 0; color: #666; font-size: 0.9rem; }
    
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; margin-bottom: 20px; background: #000; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    .action-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;}
    .download-btn { background: #333; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.3s; }
    .download-btn:hover { background: #555; }
    .complete-btn { background: #6a0dad; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .complete-btn:hover { background: #8e2de2; }
    .complete-btn.completed { background: #1e7e34; cursor: default; }
    
    .lesson-nav { display: flex; justify-content: space-between; margin-top: 20px; }
    .nav-btn { background: #6a0dad; color: #fff; padding: 12px 25px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
    .nav-btn:hover { background: #8e2de2; }
    .nav-btn:disabled { background: #ccc; cursor: not-allowed; }

    .reset-btn { background: transparent; color: #e50914; border: 1px solid #e50914; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-left: auto; }
    .reset-btn:hover { background: #e50914; color: #fff; }
    
    .back-link { display: inline-block; margin-bottom: 20px; color: #6a0dad; text-decoration: none; font-weight: bold; }
    .back-link:hover { text-decoration: underline; }

    .nav-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #6a0dad; vertical-align: middle; }

    @media (max-width: 768px) {
      .course-header h1 { font-size: 2rem; }
      .course-header p { font-size: 1rem; }
      .materials-container { padding: 0 15px; margin: 20px auto; }
      .action-row { flex-direction: column; align-items: stretch; }
      .download-btn, .complete-btn, .reset-btn { width: 100%; text-align: center; margin-left: 0; }
      .lesson-nav { flex-direction: column; gap: 10px; }
      .nav-btn { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/mass communication logo.jpg" alt="Department Logo" />
        <span>Mass Communication AAUA</span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">My Dashboard</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="forum.html">Community</a></li>
        <li><a href="profile.html">My Profile</a></li>
        <li style="display: flex; align-items: center;">
          
            <img id="nav-avatar-img" src="images/mass communication logo.jpg" alt="Profile" class="nav-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Student&background=6a0dad&color=fff';" />
          </a>
        </li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
    </nav>
  </header>

  <div class="course-header">
    <h1 id="course-title">Loading...</h1>
    <p id="course-desc"></p>
  </div>

  <div class="materials-container">
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
      <h2 style="color: #0d0d0d; margin: 0;">Course Materials</h2>
      <div style="display: flex; gap: 15px; flex-wrap: wrap;">
        <a href="#" id="quiz-btn" class="download-btn" style="background: #1e7e34; text-decoration: none;">📝 Take Quiz</a>
        <button id="reset-btn" class="reset-btn" style="display: none;">Reset Progress</button>
      </div>
    </div>
    
    <div id="lesson-container">
      <p style="color: #666;">Loading materials...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    let currentCourseId = null;
    let currentCourseCode = null;
    let currentMaterials = [];
    let completedIds = [];
    let currentLessonIndex = 0;

    async function loadCourseView() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }

      // Load Navbar Avatar
      const { data: profile } = await supabaseClient.from('profiles').select('avatar_url').eq('id', session.user.id).single();
      if (profile && profile.avatar_url) {
        document.getElementById('nav-avatar-img').src = profile.avatar_url;
      }

      const urlParams = new URLSearchParams(window.location.search);
      currentCourseId = urlParams.get('id');
      if (!currentCourseId) return;

      const { data: course } = await supabaseClient.from('courses').select('*').eq('id', currentCourseId).single();
      if (!course) return;

      currentCourseCode = course.code;
      document.getElementById('course-title').textContent = course.title;
      document.getElementById('course-desc').textContent = course.description || '';

      document.getElementById('quiz-btn').href = `quiz.html?code=${currentCourseCode}`;

      const { data: materials } = await supabaseClient
        .from('materials')
        .select('*')
        .eq('course_code', currentCourseCode)
        .order('order_index', { ascending: true }); 
        
      if (!materials || materials.length === 0) {
        document.getElementById('lesson-container').innerHTML = `<p style="color: #666; padding: 20px; background: #fff; border-radius: 8px;">No materials uploaded yet.</p>`;
        return;
      }
      currentMaterials = materials;

      const { data: progressData } = await supabaseClient
        .from('progress')
        .select('material_id')
        .eq('user_id', session.user.id);
      
      completedIds = progressData ? progressData.map(p => p.material_id) : [];

      if (completedIds.length > 0) {
        document.getElementById('reset-btn').style.display = 'block';
      }

      renderLesson();
    }

    function renderLesson() {
      const material = currentMaterials[currentLessonIndex];
      const isCompleted = completedIds.includes(material.id);
      const isFirst = currentLessonIndex === 0;
      const isLast = currentLessonIndex === currentMaterials.length - 1;

      const videoHTML = material.video_url ? `
        <div class="video-wrapper">
          <iframe src="${material.video_url}" allowfullscreen></iframe>
        </div>
      ` : '';

      const audioHTML = material.audio_url ? `
        <div style="margin: 15px 0; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #eee;">
          <p style="margin: 0 0 8px; font-size: 0.85rem; color: #6a0dad; font-weight: bold;">🎧 Audio Lesson</p>
          <audio controls style="width: 100%; outline: none;">
            <source src="${material.audio_url}" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        </div>
      ` : '';

      const textHTML = material.description ? `<p style="color: #333; line-height: 1.6; margin-bottom: 20px;">${material.description}</p>` : '';

      document.getElementById('lesson-container').innerHTML = `
        <div class="lesson-item">
          <div class="lesson-header">
            <h3>${material.title}</h3>
            <p>Lesson ${currentLessonIndex + 1} of ${currentMaterials.length} • ${material.category || 'Note'}</p>
          </div>
          
          ${textHTML}
          ${videoHTML}
          ${audioHTML}
          
          <div class="action-row">
            ${material.file_url ? `<a href="${material.file_url}" target="_blank" class="download-btn">📄 Download PDF</a>` : ''}
            <button 
              class="complete-btn ${isCompleted ? 'completed' : ''}" 
              onclick="markComplete(${material.id}, this)"
              ${isCompleted ? 'disabled' : ''}>
              ${isCompleted ? '✓ Completed' : 'Mark as Complete'}
            </button>
          </div>
          
          <div class="lesson-nav">
            <button class="nav-btn" onclick="prevLesson()" ${isFirst ? 'disabled' : ''}>← Previous Lesson</button>
            <button class="nav-btn" onclick="nextLesson()" ${isLast ? 'disabled' : ''}>Next Lesson →</button>
          </div>
        </div>
      `;
    }

    function nextLesson() {
      if (currentLessonIndex < currentMaterials.length - 1) {
        currentLessonIndex++;
        renderLesson();
        window.scrollTo(0, 0);
      }
    }

    function prevLesson() {
      if (currentLessonIndex > 0) {
        currentLessonIndex--;
        renderLesson();
        window.scrollTo(0, 0);
      }
    }

    async function markComplete(materialId, btnElement) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const { error } = await supabaseClient
        .from('progress')
        .insert([{ user_id: session.user.id, material_id: materialId }]);

      if (!error) {
        completedIds.push(materialId);
        btnElement.textContent = '✓ Completed';
        btnElement.classList.add('completed');
        btnElement.disabled = true;
        document.getElementById('reset-btn').style.display = 'block';
      } else {
        alert("Error saving progress: " + error.message);
      }
    }

    document.getElementById('reset-btn').addEventListener('click', async () => {
      if (!confirm("Are you sure you want to reset your progress for this course?")) return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const materialIds = currentMaterials.map(m => m.id);

      const { error } = await supabaseClient
        .from('progress')
        .delete()
        .eq('user_id', session.user.id)
        .in('material_id', materialIds);

      if (!error) {
        alert("Progress reset successfully!");
        window.location.reload();
      } else {
        alert("Error resetting progress: " + error.message);
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    document.addEventListener("DOMContentLoaded", loadCourseView);
  </script>
</body>
</html>
