<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course View | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    .course-header { background: linear-gradient(135deg, #0d0214 0%, #2a0845 100%); padding: 60px 20px; text-align: center; color: #fff; border-bottom: 2px solid #6a0dad; }
    .course-header h1 { font-size: 3rem; margin-bottom: 10px; }
    .course-header p { color: #e0d4eb; font-size: 1.2rem; max-width: 800px; margin: 0 auto; }
    
    .materials-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .lesson-item { display: flex; flex-direction: column; background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #6a0dad; }
    .lesson-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .lesson-info h3 { margin: 0 0 5px; color: #0d0d0d; }
    .lesson-info p { margin: 0; color: #666; font-size: 0.9rem; }
    
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 6px; margin-bottom: 15px; background: #000; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    
    .action-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
    .download-btn { background: #333; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; transition: 0.3s; }
    .download-btn:hover { background: #555; }
    .complete-btn { background: #6a0dad; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .complete-btn:hover { background: #8e2de2; }
    .complete-btn.completed { background: #1e7e34; cursor: default; }
    
    .reset-btn { background: transparent; color: #e50914; border: 1px solid #e50914; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-left: auto; }
    .reset-btn:hover { background: #e50914; color: #fff; }
    
    .back-link { display: inline-block; margin-bottom: 20px; color: #6a0dad; text-decoration: none; font-weight: bold; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/mass communication logo.jpg" alt="Department Logo" />
        <span>Mass Communication AAUA</span>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">My Dashboard</a></li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
    </nav>
  </header>

  <div class="course-header">
    <h1 id="course-title">Loading...</h1>
    <p id="course-desc"></p>
  </div>

  <div class="materials-container">
    <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2 style="color: #0d0d0d; margin: 0;">Course Materials</h2>
      <div style="display: flex; gap: 15px;">
        <!-- THE NEW QUIZ BUTTON -->
        <a href="#" id="quiz-btn" class="download-btn" style="background: #1e7e34; text-decoration: none;">📝 Take Quiz</a>
        
        <button id="reset-btn" class="reset-btn" style="display: none;">Reset Progress</button>
      </div>
    </div>
    
    <div id="lessons-list">
      <p style="color: #666;">Loading materials...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    let currentCourseId = null;
    let currentCourseCode = null;
    let currentMaterials = [];

    async function loadCourseView() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }

      const urlParams = new URLSearchParams(window.location.search);
      currentCourseId = urlParams.get('id');
      if (!currentCourseId) return;

      // Fetch Course
      const { data: course } = await supabaseClient.from('courses').select('*').eq('id', currentCourseId).single();
      if (!course) return;

      currentCourseCode = course.code;
      document.getElementById('course-title').textContent = course.title;
      document.getElementById('course-desc').textContent = course.description || '';

      // Set the Quiz Button link dynamically using the course code
      document.getElementById('quiz-btn').href = `quiz.html?code=${currentCourseCode}`;

      // Fetch Materials
      const { data: materials } = await supabaseClient.from('materials').select('*').eq('course_code', currentCourseCode);
      const lessonsList = document.getElementById('lessons-list');

      if (!materials || materials.length === 0) {
        lessonsList.innerHTML = `<p style="color: #666; padding: 20px; background: #fff; border-radius: 8px;">No materials uploaded yet.</p>`;
        return;
      }
      currentMaterials = materials;

      // Fetch User's Progress
      const { data: progressData } = await supabaseClient
        .from('progress')
        .select('material_id')
        .eq('user_id', session.user.id);
      
      const completedIds = progressData ? progressData.map(p => p.material_id) : [];

      // Show Reset button if there is progress
      if (completedIds.length > 0) {
        document.getElementById('reset-btn').style.display = 'block';
      }

      // Render Materials
      lessonsList.innerHTML = materials.map(material => {
        const isCompleted = completedIds.includes(material.id);
        const videoHTML = material.video_url ? `
          <div class="video-wrapper">
            <iframe src="${material.video_url}" allowfullscreen></iframe>
          </div>
        ` : '';

        return `
          <div class="lesson-item">
            <div class="lesson-header">
              <div class="lesson-info">
                <h3>${material.title}</h3>
                <p>${material.category || 'Note'} • ${material.semester || 'Semester'}</p>
              </div>
            </div>
            ${videoHTML}
            <div class="action-row">
              ${material.file_url ? `<a href="${material.file_url}" target="_blank" class="download-btn">📄 Download PDF</a>` : ''}
              <button 
                class="complete-btn ${isCompleted ? 'completed' : ''}" 
                onclick="markComplete(${material.id}, this)"
                ${isCompleted ? 'disabled' : ''}>
                ${isCompleted ? '✓ Completed' : 'Mark as Complete'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function markComplete(materialId, btnElement) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const { error } = await supabaseClient
        .from('progress')
        .insert([{ user_id: session.user.id, material_id: materialId }]);

      if (!error) {
        btnElement.textContent = '✓ Completed';
        btnElement.classList.add('completed');
        btnElement.disabled = true;
        document.getElementById('reset-btn').style.display = 'block';
      } else {
        alert("Error saving progress: " + error.message);
      }
    }

    document.getElementById('reset-btn').addEventListener('click', async () => {
      if (!confirm("Are you sure you want to reset your progress for this course?")) return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return;

      const materialIds = currentMaterials.map(m => m.id);

      const { error } = await supabaseClient
        .from('progress')
        .delete()
        .eq('user_id', session.user.id)
        .in('material_id', materialIds);

      if (!error) {
        alert("Progress reset successfully!");
        window.location.reload();
      } else {
        alert("Error resetting progress: " + error.message);
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    document.addEventListener("DOMContentLoaded", loadCourseView);
  </script>
</body>
</html>
