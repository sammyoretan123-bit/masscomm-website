<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBT Mode | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    .quiz-container { max-width: 800px; margin: 40px auto; padding: 20px; }
    .timer-bar { position: sticky; top: 0; z-index: 100; background: #fff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #6a0dad; }
    .timer-text { font-size: 1.5rem; font-weight: bold; color: #0d0d0d; }
    .timer-text.warning { color: #e50914; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .question-card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid #ccc; }
    .question-card h3 { color: #0d0d0d; margin-top: 0; margin-bottom: 15px; }
    .option-label { display: block; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid #eee; transition: 0.2s; }
    .option-label:hover { background: #f0e6fa; border-color: #6a0dad; }
    .option-label input { margin-right: 10px; }
    .submit-btn { background: #6a0dad; color: #fff; padding: 15px 30px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
    .submit-btn:hover { background: #8e2de2; }
    .result-box { background: #1e7e34; color: #fff; padding: 30px; border-radius: 12px; text-align: center; font-size: 1.5rem; display: none; margin-top: 20px; flex-direction: column; gap: 20px; align-items: center; }
    .nav-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #6a0dad; vertical-align: middle; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo"><img src="images/mass communication logo.jpg" alt="Logo" /><span>Mass Communication AAUA</span></div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">My Dashboard</a></li>
        <li><a href="forum.html">Community</a></li>
        
        <li style="display: flex; align-items: center;"><a href="profile.html" style="padding: 0;"><img id="nav-avatar-img" src="images/mass communication logo.jpg" alt="Profile" class="nav-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Student&background=6a0dad&color=fff';" /></a></li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
    </nav>
  </header>

  <div class="quiz-container">
    <div class="timer-bar" id="timer-bar" style="display: none;">
      <span style="font-weight: bold; color: #666;">Time Remaining:</span>
      <span class="timer-text" id="timer">15:00</span>
    </div>
    <h1 id="quiz-title" style="color: #0d0d0d;">Loading Quiz...</h1>
    <form id="quiz-form">
      <div id="questions-list"></div>
      <button type="submit" class="submit-btn" id="submit-btn" style="display: none;">Submit Quiz</button>
    </form>
    <div class="result-box" id="result-box"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    let correctAnswers = {}; 
    let timerInterval;
    let timeLeft = 15 * 60; 
    let isSubmitted = false;

    window.addEventListener('beforeunload', function (e) {
      if (!isSubmitted && document.getElementById('quiz-form').style.display !== 'none') {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    function startTimer() {
      const timerDisplay = document.getElementById('timer');
      document.getElementById('timer-bar').style.display = 'flex';
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerDisplay.textContent = "00:00";
          autoSubmit();
          return;
        }
        timeLeft--;
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        if (timeLeft <= 120) timerDisplay.classList.add('warning');
      }, 1000);
    }

    async function loadQuiz() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }

      const { data: profile } = await supabaseClient.from('profiles').select('avatar_url').eq('id', session.user.id).single();
      if (profile && profile.avatar_url) document.getElementById('nav-avatar-img').src = profile.avatar_url;

      const urlParams = new URLSearchParams(window.location.search);
      const courseCode = urlParams.get('code'); 

      if (!courseCode) {
        document.getElementById('quiz-title').textContent = "No quiz found.";
        return;
      }

      document.getElementById('quiz-title').textContent = `CBT: ${courseCode}`;

      const { data: questions, error } = await supabaseClient.from('quizzes').select('*').eq('course_code', courseCode);

      if (error || !questions || questions.length === 0) {
        document.getElementById('quiz-title').textContent = "No questions available for this course yet.";
        return;
      }

      const questionsList = document.getElementById('questions-list');
      questionsList.innerHTML = questions.map((q, index) => {
        correctAnswers[q.id] = q.correct_answer; 
        return `
          <div class="question-card">
            <h3>${index + 1}. ${q.question}</h3>
            <label class="option-label"><input type="radio" name="q_${q.id}" value="A" required> A) ${q.option_a}</label>
            <label class="option-label"><input type="radio" name="q_${q.id}" value="B"> B) ${q.option_b}</label>
            <label class="option-label"><input type="radio" name="q_${q.id}" value="C"> C) ${q.option_c}</label>
            <label class="option-label"><input type="radio" name="q_${q.id}" value="D"> D) ${q.option_d}</label>
          </div>
        `;
      }).join('');

      document.getElementById('submit-btn').style.display = 'block';
      startTimer(); 
    }

    async function processSubmission(e) {
      if (e) e.preventDefault(); 
      if (isSubmitted) return;
      isSubmitted = true;

      clearInterval(timerInterval); 
      document.getElementById('submit-btn').style.display = 'none';
      document.getElementById('timer-bar').style.display = 'none';

      const { data: { session } } = await supabaseClient.auth.getSession();
      const form = document.getElementById('quiz-form');
      const formData = new FormData(form);
      
      let score = 0;
      let totalQuestions = Object.keys(correctAnswers).length;
      const urlParams = new URLSearchParams(window.location.search);
      const courseCode = urlParams.get('code'); 

      for (let [key, value] of formData.entries()) {
        const questionId = key.split('_')[1];
        if (correctAnswers[questionId] === value) {
          score++;
        }
      }

      const percentage = Math.round((score / totalQuestions) * 100);

      console.log("Attempting to save score:", { user_id: session.user.id, course_code: courseCode, score: score, total_questions: totalQuestions });

      const { error: saveError } = await supabaseClient
        .from('quiz_scores')
        .insert([{ 
          user_id: session.user.id, 
          course_code: courseCode, 
          score: score, 
          total_questions: totalQuestions 
        }]);

      // ADDED ALERT TO CATCH ERRORS
      if (saveError) {
        alert("DATABASE SAVE FAILED! Reason: " + saveError.message);
        console.error("Error saving score:", saveError);
        isSubmitted = false; // Allow them to try again
        return;
      } else {
        console.log("Score saved successfully to database!");
      }

      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'flex'; 
      resultBox.innerHTML = `
        <span style="margin: 0; font-weight: bold;">You scored ${score} out of ${totalQuestions} (${percentage}%)</span>
        <a href="leaderboard.html" style="background: #fff; color: #1e7e34; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 1rem;">Go to Leaderboard</a>
      `;
      resultBox.style.background = percentage >= 50 ? '#1e7e34' : '#e50914'; 
    }

    function autoSubmit() {
      alert("Time is up! Your quiz is being submitted automatically.");
      processSubmission();
    }

    document.getElementById('quiz-form').addEventListener('submit', processSubmission);
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });
    document.addEventListener("DOMContentLoaded", loadQuiz);
  </script>
</body>
</html>
