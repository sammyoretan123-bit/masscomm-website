<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Course Materials | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />

  <!-- IMMEDIATE AUTH CHECK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        // If they are not logged in, throw them to the login page instantly
        window.location.replace("login.html");
      }
    })();
  </script>
</head>
<body>

  <!-- ============ STUDENT NAVBAR ============ -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/mass communication logo.jpg" alt="Department Logo" />
        <span>Mass Communication AAUA</span>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">My Dashboard</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="forum.html">Community</a></li>
        <li><a href="profile.html">My Profile</a></li>
        <li style="display: flex; align-items: center;">
          <a href="profile.html" style="padding: 0;">
            <img id="nav-avatar-img" src="images/mass communication logo.jpg" alt="Profile" style="width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #6a0dad;" onerror="this.src='https://ui-avatars.com/api/?name=Student&background=6a0dad&color=fff';" />
          </a>
        </li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
      <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    </nav>
  </header>

  <!-- Blank Space (What they see before getting redirected) -->
  <div style="min-height: 60vh; display: flex; justify-content: center; align-items: center;">
      <p style="color: #666; font-size: 1.2rem;">Redirecting to login...</p>
  </div>

  <footer>
    <p>&copy; 2026 Mass Communication Department &mdash; Student Association.</p>
    <div class="footer-credit">
      <img src="images/the-vanguard-logo.jpg" alt="The Vanguard Movement Logo" />
      <div class="footer-credit-text">
        <div class="powered-by">Built &amp; Managed by</div>
        <div class="movement-name">The Vanguard Movement</div>
        <div class="admin-name">Oretan Led-Admin &bull; 2026/2027</div>
      </div>
    </div>
  </footer>

  <script>
    // Load Avatar and handle logout
    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const { data: profile } = await supabaseClient.from('profiles').select('avatar_url').eq('id', session.user.id).single();
        if (profile && profile.avatar_url) {
          document.getElementById('nav-avatar-img').src = profile.avatar_url;
        }
      }
      
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
