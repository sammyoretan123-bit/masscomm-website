<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Password | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
    .update-box { background: #fff; color: #333; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    .update-box img { height: 70px; border-radius: 50%; margin-bottom: 20px; }
    .update-box h2 { color: #6a0dad; margin-bottom: 10px; }
    .update-box p { color: #666; margin-bottom: 30px; font-size: 0.95rem; }
    .update-box label { display: block; text-align: left; font-weight: bold; margin-bottom: 5px; color: #333; }
    .update-box input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; font-size: 1rem; }
    .update-box button { width: 100%; background: #6a0dad; color: #fff; border: none; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
    .update-box button:hover { background: #8e2de2; }
    #message { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="update-box">
    <img src="images/mass communication logo.jpg" alt="Logo" />
    <h2>New Password</h2>
    <p>Enter your new password below.</p>
    
    <form id="update-form" style="display: none;">
      <label for="password">New Password</label>
      <input type="password" id="password" placeholder="Enter new password" required minlength="6" />
      <button type="submit" id="update-btn">Update Password</button>
    </form>

    <p id="message" style="color: #666;">Verifying your reset link...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // 1. Listen for the session to load from the URL hash
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
      const msg = document.getElementById('message');
      const form = document.getElementById('update-form');

      if (event === "PASSWORD_RECOVERY" || session) {
        // Valid session detected! Show the form.
        msg.textContent = '';
        form.style.display = 'block';
      } else if (event === "SIGNED_OUT") {
        msg.style.color = '#e50914';
        msg.textContent = 'Invalid or expired reset link. Please request a new one.';
        form.style.display = 'none';
      }
    });

    // 2. Handle the form submission
    document.getElementById('update-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const msg = document.getElementById('message');
      const btn = document.getElementById('update-btn');

      btn.textContent = 'Updating...';
      btn.disabled = true;

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: password });
        if (error) throw error;

        msg.style.color = '#1e7e34';
        msg.textContent = '✅ Password updated successfully! Redirecting to login...';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (err) {
        msg.style.color = '#e50914';
        msg.textContent = 'Error: ' + err.message;
        btn.textContent = 'Update Password';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
