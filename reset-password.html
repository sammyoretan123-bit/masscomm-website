<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
    .reset-box { background: #fff; color: #333; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    .reset-box img { height: 70px; border-radius: 50%; margin-bottom: 20px; }
    .reset-box h2 { color: #6a0dad; margin-bottom: 10px; }
    .reset-box p { color: #666; margin-bottom: 30px; font-size: 0.95rem; }
    .reset-box label { display: block; text-align: left; font-weight: bold; margin-bottom: 5px; color: #333; }
    .reset-box input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; font-size: 1rem; }
    .reset-box button { width: 100%; background: #6a0dad; color: #fff; border: none; padding: 14px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
    .reset-box button:hover { background: #8e2de2; }
    .reset-box .back-link { display: inline-block; margin-top: 20px; color: #6a0dad; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
    #message { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="reset-box">
    <img src="images/mass communication logo.jpg" alt="Logo" />
    <h2>Reset Password</h2>
    <p>Enter your email address and we'll send you a link to reset your password.</p>
    
    <form id="reset-form">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address" required />
      <button type="submit" id="reset-btn">Send Reset Link</button>
    </form>

    <a href="login.html" class="back-link">&larr; Back to Login</a>
    <p id="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const msg = document.getElementById('message');
      const btn = document.getElementById('reset-btn');

      btn.textContent = 'Sending...';
      btn.disabled = true;
      msg.style.color = '#666';
      msg.textContent = '';

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/update-password.html'
        });

        if (error) throw error;

        msg.style.color = '#1e7e34';
        msg.textContent = '✅ Reset link sent! Check your email inbox.';
        btn.textContent = 'Send Reset Link';
        btn.disabled = false;

      } catch (err) {
        msg.style.color = '#e50914';
        msg.textContent = 'Error: ' + err.message;
        btn.textContent = 'Send Reset Link';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
