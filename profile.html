<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    .profile-container { max-width: 600px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #6a0dad; }
    .profile-container h2 { color: #0d0d0d; margin-top: 0; }
    .avatar-preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #6a0dad; display: block; margin: 20px auto; }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .btn-save { background: #6a0dad; color: #fff; padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
    .btn-save:hover { background: #520a85; }
    
    /* Navbar styles */
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #000; }
    .nav-profile-link { display: flex; align-items: center; text-decoration: none; color: #fff; }
    .nav-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #6a0dad; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo" style="display:flex; align-items:center; gap:10px; color:white;">
        <img src="images/mass communication logo.jpg" alt="Logo" style="height:40px; border-radius:50%;" />
        <span style="font-weight:bold; font-size: 1.1rem;">Mass Communication AAUA</span>
      </div>
      <ul class="nav-links" style="display:flex; gap:20px; list-style:none; margin:0; align-items:center;">
        <li><a href="index.html" style="color:#fff; text-decoration:none;">Home</a></li>
        <li><a href="dashboard.html" style="color:#fff; text-decoration:none;">My Dashboard</a></li>
        <li><a href="profile.html" style="color:#6a0dad; font-weight:bold; text-decoration:none;">My Profile</a></li>
        <li>
          <a href="profile.html" class="nav-profile-link">
            <img id="nav-avatar-img" 
                 src="images/mass communication logo.jpg" 
                 alt="Profile" 
                 class="nav-avatar" 
                 onerror="this.src='https://ui-avatars.com/api/?name=Student&background=6a0dad&color=fff';" />
          </a>
        </li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
    </nav>
  </header>

  <div class="profile-container">
    <h2>My Profile</h2>
    <p style="color: #666; font-size: 0.9rem;">Update your profile picture and details here.</p>
    
    <img id="profile-page-avatar" 
         src="images/mass communication logo.jpg" 
         alt="Profile Picture" 
         class="avatar-preview" 
         onerror="this.src='https://ui-avatars.com/api/?name=Student&background=6a0dad&color=fff';" />
    
    <div class="form-group">
      <label>Upload New Profile Picture:</label>
      <input type="file" id="avatar-upload-input" accept="image/*" />
    </div>

    <div class="form-group">
      <label>Full Name:</label>
      <input type="text" id="profile-fullname" placeholder="Enter your full name" />
    </div>

    <button id="save-profile-btn" class="btn-save">Save Changes</button>
    <p id="status-msg" style="text-align: center; margin-top: 15px; font-weight: bold; color: green;"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    let currentUser = null;
    let newAvatarUrl = null;

    async function loadProfile() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }
      currentUser = session.user;

      // Get profile data from database
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('full_name, avatar_url')
        .eq('id', currentUser.id)
        .single();

      if (profile) {
        document.getElementById('profile-fullname').value = profile.full_name || '';
        newAvatarUrl = profile.avatar_url;

        if (profile.avatar_url) {
          document.getElementById('profile-page-avatar').src = profile.avatar_url;
          document.getElementById('nav-avatar-img').src = profile.avatar_url;
        }
      }
    }

    // Preview image before upload
    document.getElementById('avatar-upload-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          document.getElementById('profile-page-avatar').src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Save button click
    document.getElementById('save-profile-btn').addEventListener('click', async () => {
      const statusMsg = document.getElementById('status-msg');
      const fileInput = document.getElementById('avatar-upload-input');
      const fullName = document.getElementById('profile-fullname').value;
      statusMsg.style.color = 'blue';
      statusMsg.textContent = 'Saving...';

      // 1. Upload image if selected
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const filePath = `${currentUser.id}-${Date.now()}.${fileExt}`;

        // Upload to Supabase Storage bucket named 'avatars'
        const { error: uploadError } = await supabaseClient.storage
          .from('avatars')
          .upload(filePath, file, { upsert: true });

        if (uploadError) {
          statusMsg.style.color = 'red';
          statusMsg.textContent = 'Upload failed: ' + uploadError.message;
          return;
        }

        // Get public URL for the uploaded image
        const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(filePath);
        newAvatarUrl = urlData.publicUrl;
      }

      // 2. Update database with new name and avatar URL
      const { error: updateError } = await supabaseClient
        .from('profiles')
        .update({ full_name: fullName, avatar_url: newAvatarUrl })
        .eq('id', currentUser.id);

      if (updateError) {
        statusMsg.style.color = 'red';
        statusMsg.textContent = 'Save failed: ' + updateError.message;
        return;
      }

      statusMsg.style.color = 'green';
      statusMsg.textContent = '✅ Profile updated successfully!';
      
      // Update navbar avatar instantly
      document.getElementById('nav-avatar-img').src = newAvatarUrl;
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    document.addEventListener("DOMContentLoaded", loadProfile);
  </script>
</body>
</html>
