<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    .profile-container { max-width: 600px; margin: 40px auto; padding: 20px; }
    .profile-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
    .avatar-preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid #6a0dad; margin-bottom: 20px; background: #eee; }
    .profile-card label { display: block; text-align: left; font-weight: bold; margin-bottom: 5px; color: #333; }
    .profile-card input[type="text"], .profile-card input[type="file"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .profile-card button { width: 100%; padding: 12px; background: #6a0dad; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .profile-card button:hover { background: #8e2de2; }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/mass communication logo.jpg" alt="Department Logo" />
        <span>Mass Communication AAUA</span>
      </div>
      <ul class="nav-links" id="navLinks">
        <li><a href="dashboard.html">My Dashboard</a></li>
        <li><a href="profile.html" style="color: #6a0dad; font-weight: bold;">My Profile</a></li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
      <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    </nav>
  </header>

  <div class="profile-container">
    <div class="profile-card">
      <h2 style="color: #6a0dad; margin-top: 0; margin-bottom: 30px;">My Profile Settings</h2>
      
      <img id="avatar-preview" src="images/mass communication logo.jpg" class="avatar-preview" />
      
      <form id="profile-form">
        <label>Full Name</label>
        <input type="text" id="full-name" placeholder="e.g. John Doe" required />

        <label>Profile Picture</label>
        <input type="file" id="avatar-file" accept="image/*" />

        <button type="submit" id="save-btn">Save Profile</button>
        <p id="status-msg" style="margin-top: 15px; font-weight: bold;"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    let currentUser = null;

    async function loadProfile() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }
      currentUser = session.user;

      // Fetch existing profile data
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      if (profile) {
        document.getElementById('full-name').value = profile.full_name || '';
        if (profile.avatar_url) {
          document.getElementById('avatar-preview').src = profile.avatar_url;
        }
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('save-btn');
      const statusMsg = document.getElementById('status-msg');
      const fileInput = document.getElementById('avatar-file');
      const fullName = document.getElementById('full-name').value;

      saveBtn.textContent = "Saving...";
      saveBtn.disabled = true;
      statusMsg.textContent = "";

      let avatarUrl = document.getElementById('avatar-preview').src;

      // 1. Upload new image if selected
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileExt = file.name.split('.').pop();
        // Unique filename prevents "upsert" permission errors
        const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;

        // Upload the file (No upsert flag)
        const { data: uploadData, error: uploadError } = await supabaseClient.storage
          .from('avatars')
          .upload(fileName, file);

        if (uploadError) {
          statusMsg.style.color = "red";
          statusMsg.textContent = "Error uploading image: " + uploadError.message;
          saveBtn.textContent = "Save Profile";
          saveBtn.disabled = false;
          return;
        }

        // Get the public URL
        const { data: publicUrlData } = supabaseClient.storage
          .from('avatars')
          .getPublicUrl(uploadData.path);
        
        avatarUrl = publicUrlData.publicUrl;
      }

      // 2. Save to database
      const { error: dbError } = await supabaseClient
        .from('profiles')
        .upsert({ 
          id: currentUser.id, 
          full_name: fullName, 
          avatar_url: avatarUrl 
        });

      if (dbError) {
        statusMsg.style.color = "red";
        statusMsg.textContent = "Error saving profile: " + dbError.message;
      } else {
        statusMsg.style.color = "green";
        statusMsg.textContent = "Profile saved successfully!";
        document.getElementById('avatar-preview').src = avatarUrl;
      }

      saveBtn.textContent = "Save Profile";
      saveBtn.disabled = false;
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    document.addEventListener("DOMContentLoaded", loadProfile);
  </script>
</body>
</html>
