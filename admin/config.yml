backend:
  name: github
  repo: sammyoretan123-bit/masscomm-website
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "activities"
    label: "Activities"
    label_singular: "Activity"
    folder: "content/activities"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Cover Image", name: "cover", widget: "image" }
      - { label: "Photo Gallery", name: "gallery", widget: "list", field: { label: "Image", name: "image", widget: "image" } }

  - name: "lecturers"
    label: "Lecturers"
    label_singular: "Lecturer"
    folder: "content/lecturers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }