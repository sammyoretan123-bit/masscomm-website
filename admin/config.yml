backend:
  name: github
  repo: sammyoretan123-bit/masscomm-website
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "activities"
    label: "Activities"
    label_singular: "Activity"
    folder: "content/activities"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Cover Image", name: "cover", widget: "image" }
      - { label: "Photo Gallery", name: "gallery", widget: "list", field: { label: "Image", name: "image", widget: "image" } }

  - name: "lecturers"
    label: "Lecturers"
    label_singular: "Lecturer"
    folder: "content/lecturers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Sequence", name: "sequence", widget: "select", required: false, options: ["PRAD", "Broadcast", "Print"] }

  - name: "sequences"
    label: "Sequences"
    label_singular: "Sequence"
    folder: "content/sequences"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Slug", name: "slug_key", widget: "select", options: ["prad", "broadcast", "print"], hint: "Important: must match the page. Choose 'prad', 'broadcast', or 'print'." }
      - { label: "Page Title", name: "title", widget: "string", hint: "e.g. Public Relations & Advertising" }
      - { label: "Subtitle", name: "subtitle", widget: "string", hint: "e.g. PRAD Sequence" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "What You'll Learn", name: "learn", widget: "list", field: { label: "Item", name: "item", widget: "string" } }
      - { label: "Related Courses", name: "courses", widget: "list", field: { label: "Course", name: "course", widget: "string" } }
      - { label: "Photo Gallery", name: "gallery", widget: "list", field: { label: "Image", name: "image", widget: "image" } }

  - name: "about"
    label: "About Page"
    label_singular: "About Entry"
    folder: "content/about"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Page Heading", name: "heading", widget: "string", default: "About the Department" }
      - { label: "Page Subtitle", name: "subtitle", widget: "string", default: "Learn more about Mass Communication" }
      - { label: "Who We Are", name: "who_we_are", widget: "text" }
      - { label: "Our Mission", name: "mission", widget: "text" }
      - { label: "Our Vision", name: "vision", widget: "text" }
      - { label: "Programmes Offered", name: "programmes", widget: "list", field: { label: "Programme", name: "programme", widget: "string" } }
      - { label: "Student Association", name: "student_association", widget: "text" }

  - name: "hod"
    label: "HOD"
    label_singular: "HOD Entry"
    folder: "content/hod"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string", default: "Head of Department" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Welcome Message", name: "message", widget: "text" }

  - name: "hod-history"
    label: "HOD History"
    label_singular: "Past HOD"
    folder: "content/hod-history"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Years Served", name: "years", widget: "string", hint: "e.g. 2015 – 2018" }
      - { label: "Display Order", name: "order", widget: "number", default: 1, hint: "1 = most recent past HOD. Increase for older ones." }

  - name: "executives"
    label: "Executives"
    label_singular: "Executive"
    folder: "content/executives"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Position", name: "position", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Display Order", name: "order", widget: "number", default: 1, hint: "1 = shows first. President should be 1, VP 2, etc." }

  - name: "past-executives"
    label: "Past Executives"
    label_singular: "Past Executive"
    folder: "content/past-executives"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Administration Name", name: "admin_name", widget: "string", hint: "e.g. Oretan Led-Admin 2026/2027" }
      - { label: "Set Year", name: "set_year", widget: "string", hint: "e.g. 2023/2024" }
      - { label: "Admin Order", name: "admin_order", widget: "number", default: 1, hint: "1 = most recent administration. Increase for older ones." }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Position", name: "position", widget: "string", hint: "e.g. President, Vice President, Secretary" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Position Order", name: "order", widget: "number", default: 1, hint: "1 = President, 2 = VP, 3 = Secretary, etc." }

  - name: "sets"
    label: "Sets"
    label_singular: "Set"
    folder: "content/sets"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Set Name", name: "set_name", widget: "string", hint: "e.g. Luminary Class 2027" }
      - { label: "Set Year", name: "year", widget: "string", hint: "e.g. 2023/2024" }
      - { label: "Level", name: "level", widget: "select", options: ["100L", "200L", "300L", "400L"] }
      - { label: "Class Rep Name", name: "rep_name", widget: "string" }
      - { label: "Class Rep Photo", name: "rep_photo", widget: "image" }
      - { label: "Photo Gallery", name: "gallery", widget: "list", field: { label: "Image", name: "image", widget: "image" }, hint: "Add as many photos as you want" }

  - name: "gallery"
    label: "Gallery Sections"
    label_singular: "Gallery Section"
    folder: "content/gallery"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Section Title", name: "title", widget: "string", hint: "e.g. Sports, Press Week, Freshers Orientation" }
      - { label: "Display Order", name: "order", widget: "number", default: 1, hint: "1 = shows first. Increase for later sections." }
      - { label: "Photos", name: "photos", widget: "list", field: { label: "Image", name: "image", widget: "image" }, hint: "Add as many photos as you want" }

  - name: "gallery-settings"
    label: "Gallery Settings"
    label_singular: "Gallery Setting"
    folder: "content/gallery-settings"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Page Heading", name: "heading", widget: "string", default: "Photo Gallery" }
      - { label: "Subtitle", name: "subtitle", widget: "string", default: "Moments from our events and activities" }

  - name: "news"
    label: "News"
    label_singular: "News Item"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "DD MMMM YYYY", time_format: false, format: "DD MMMM YYYY" }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog"
    label: "Blog"
    label_singular: "Blog Post"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "DD MMMM YYYY", time_format: false, format: "DD MMMM YYYY" }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "courses"
    label: "Courses"
    label_singular: "Course"
    folder: "content/courses"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Course Code", name: "code", widget: "string", hint: "e.g. MAC 101" }
      - { label: "Course Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Lecturer Name", name: "lecturer_name", widget: "string" }
      - { label: "Lecturer Title", name: "lecturer_title", widget: "string", hint: "e.g. Dr., Prof., Mr., Mrs." }
      - { label: "Post in Charge", name: "post", widget: "string", hint: "e.g. Course Coordinator, Lecturer, HOD" }

  - name: "contact"
    label: "Contact Info"
    label_singular: "Contact"
    folder: "content/contact"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Department Address", name: "address", widget: "text" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Phone", name: "phone", widget: "string" }
      - { label: "Instagram", name: "instagram", widget: "string", required: false, hint: "e.g. @masscomm_aaua" }
      - { label: "X (Twitter)", name: "twitter", widget: "string", required: false, hint: "e.g. @masscomm_aaua" }
      - { label: "Facebook", name: "facebook", widget: "string", required: false }
      - { label: "TikTok", name: "tiktok", widget: "string", required: false }