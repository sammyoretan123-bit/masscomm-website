backend:
  name: github
  repo: sammyoretan123-bit/masscomm-website
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "activities"
    label: "Activities"
    label_singular: "Activity"
    folder: "content/activities"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Cover Image", name: "cover", widget: "image" }
      - { label: "Photo Gallery", name: "gallery", widget: "list", field: { label: "Image", name: "image", widget: "image" } }

  - name: "lecturers"
    label: "Lecturers"
    label_singular: "Lecturer"
    folder: "content/lecturers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }

  - name: "hod"
    label: "HOD"
    label_singular: "HOD Entry"
    folder: "content/hod"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string", default: "Head of Department" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Welcome Message", name: "message", widget: "text" }

  - name: "executives"
    label: "Executives"
    label_singular: "Executive"
    folder: "content/executives"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Position", name: "position", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Display Order", name: "order", widget: "number", default: 1, hint: "1 = shows first. President should be 1, VP 2, etc." }

  - name: "news"
    label: "News"
    label_singular: "News Item"
    folder: "content/news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "DD MMMM YYYY", time_format: false, format: "DD MMMM YYYY" }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "blog"
    label: "Blog"
    label_singular: "Blog Post"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "DD MMMM YYYY", time_format: false, format: "DD MMMM YYYY" }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "courses"
    label: "Courses"
    label_singular: "Course"
    folder: "content/courses"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Course Code", name: "code", widget: "string", hint: "e.g. MAC 101" }
      - { label: "Course Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Lecturer Name", name: "lecturer_name", widget: "string" }
      - { label: "Lecturer Title", name: "lecturer_title", widget: "string", hint: "e.g. Dr., Prof., Mr., Mrs." }
      - { label: "Post in Charge", name: "post", widget: "string", hint: "e.g. Course Coordinator, Lecturer, HOD" }