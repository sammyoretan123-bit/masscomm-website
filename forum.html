<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Forum | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    .forum-container { max-width: 900px; margin: 40px auto; padding: 20px; }
    .new-post-box { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
    .new-post-box textarea { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; resize: vertical; margin-bottom: 10px; box-sizing: border-box; }
    .new-post-box button { background: #6a0dad; color: #fff; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .post-card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border-left: 5px solid #ccc; }
    .post-card.announcement { border-left-color: #e50914; background: #fff9f9; }
    .post-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: #888; }
    .post-author { font-weight: bold; color: #6a0dad; }
    .post-content { color: #333; line-height: 1.6; white-space: pre-wrap; margin-bottom: 15px; }
    .badge-announcement { background: #e50914; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-left: 10px; }
    .social-actions { display: flex; gap: 15px; border-top: 1px solid #eee; padding-top: 10px; }
    .social-btn { background: none; border: none; color: #666; font-weight: bold; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
    .social-btn:hover { color: #6a0dad; }
    .social-btn.liked { color: #6a0dad; }
    .replies-section { margin-top: 15px; padding-left: 20px; border-left: 2px solid #eee; display: none; }
    .reply-box { background: #f9f9f9; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem; }
    .reply-box strong { color: #6a0dad; }
    .reply-input-box { display: flex; gap: 10px; margin-top: 10px; }
    .reply-input-box input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .reply-input-box button { background: #6a0dad; color: #fff; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .nav-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #6a0dad; vertical-align: middle; }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo"><img src="images/mass communication logo.jpg" alt="Logo" /><span>Mass Communication AAUA</span></div>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">My Dashboard</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="history.html">My History</a></li>
        <li><a href="forum.html" style="color: #6a0dad; font-weight: bold;">Community</a></li>
        <li><button id="theme-toggle" style="background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; padding: 0 10px;">🌙</button></li>
        <li style="display: flex; align-items: center;"><a href="profile.html" style="padding: 0;"><img id="nav-avatar-img" src="images/mass communication logo.jpg" alt="Profile" class="nav-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Student&background=6a0dad&color=fff';" /></a></li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
      <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    </nav>
  </header>
  <div class="forum-container">
    <h1 style="margin-bottom: 20px;" class="page-title">Department Forum</h1>
    <div class="new-post-box">
      <h3 style="margin-top: 0; color: #0d0d0d;">Share an update or ask a question</h3>
      <textarea id="post-content" rows="3" placeholder="What's on your mind?"></textarea>
      <button id="post-btn">Post to Forum</button>
    </div>
    <div id="posts-list"><p style="text-align: center; color: #666;">Loading posts...</p></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); if (themeToggleBtn) themeToggleBtn.textContent = '☀️'; }
    if (themeToggleBtn) { themeToggleBtn.addEventListener('click', () => { document.body.classList.toggle('dark-mode'); if (document.body.classList.contains('dark-mode')) { localStorage.setItem('theme', 'dark'); themeToggleBtn.textContent = '☀️'; } else { localStorage.setItem('theme', 'light'); themeToggleBtn.textContent = '🌙'; } }); }
    let currentUser = null;
    async function loadNavbarAvatar(userId) { const { data: profile } = await supabaseClient.from('profiles').select('avatar_url').eq('id', userId).single(); if (profile && profile.avatar_url) { document.getElementById('nav-avatar-img').src = profile.avatar_url; } }
    async function loadPosts() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }
      currentUser = session.user;
      loadNavbarAvatar(currentUser.id);
      const { data: posts, error } = await supabaseClient.from('posts').select('*').order('created_at', { ascending: false });
      const postsList = document.getElementById('posts-list');
      if (error || !posts) { postsList.innerHTML = `<p style="text-align: center; color: #666;">Could not load posts.</p>`; return; }
      const { data: likes } = await supabaseClient.from('post_likes').select('*');
      const { data: allReplies } = await supabaseClient.from('replies').select('*').order('created_at', { ascending: true });
      if (posts.length === 0) { postsList.innerHTML = `<p style="text-align: center; color: #666;">No posts yet. Be the first to say hello!</p>`; return; }
      postsList.innerHTML = posts.map(post => {
        const date = new Date(post.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        const isAnnouncement = post.is_announcement ? 'announcement' : '';
        const badge = post.is_announcement ? '<span class="badge-announcement">ANNOUNCEMENT</span>' : '';
        const postLikes = likes ? likes.filter(l => l.post_id === post.id) : [];
        const likeCount = postLikes.length;
        const hasLiked = postLikes.some(l => l.user_id === currentUser.id);
        const postReplies = allReplies ? allReplies.filter(r => r.post_id === post.id) : [];
        let repliesHTML = postReplies.map(reply => `<div class="reply-box"><strong>${reply.author_name}</strong>: ${reply.content}</div>`).join('');
        return `
          <div class="post-card ${isAnnouncement}">
            <div class="post-header"><span class="post-author">${post.author_name} ${badge}</span><span>${date}</span></div>
            <div class="post-content">${post.content}</div>
            <div class="social-actions">
              <button class="social-btn ${hasLiked ? 'liked' : ''}" onclick="toggleLike(${post.id}, this)">${hasLiked ? '❤️' : '🤍'} Like (${likeCount})</button>
              <button class="social-btn" onclick="toggleReplies(${post.id})">💬 Reply (${postReplies.length})</button>
            </div>
            <div id="replies-${post.id}" class="replies-section">
              <div id="reply-list-${post.id}">${repliesHTML}</div>
              <div class="reply-input-box"><input type="text" id="reply-input-${post.id}" placeholder="Write a reply..."><button onclick="submitReply(${post.id})">Send</button></div>
            </div>
          </div>`;
      }).join('');
    }
    async function toggleLike(postId, btnElement) {
      const hasLiked = btnElement.classList.contains('liked');
      if (hasLiked) { await supabaseClient.from('post_likes').delete().match({ post_id: postId, user_id: currentUser.id }); } else { await supabaseClient.from('post_likes').insert([{ post_id: postId, user_id: currentUser.id }]); }
      loadPosts();
    }
    function toggleReplies(postId) { const section = document.getElementById(`replies-${postId}`); section.style.display = (section.style.display === 'none' || section.style.display === '') ? 'block' : 'none'; }
    async function submitReply(postId) {
      const input = document.getElementById(`reply-input-${postId}`); const content = input.value.trim(); if (!content) return;
      const authorName = currentUser.email.split('@')[0];
      const { error } = await supabaseClient.from('replies').insert([{ post_id: postId, author_name: authorName, content: content }]);
      if (error) { alert("Error posting reply: " + error.message); } else { input.value = ""; loadPosts(); setTimeout(() => { const section = document.getElementById(`replies-${postId}`); if (section) section.style.display = 'block'; }, 500); }
    }
    document.getElementById('post-btn').addEventListener('click', async () => {
      const content = document.getElementById('post-content').value.trim(); if (!content) return alert("Please write something first.");
      const btn = document.getElementById('post-btn'); btn.textContent = "Posting..."; btn.disabled = true;
      const authorName = currentUser.email.split('@')[0];
      const { error } = await supabaseClient.from('posts').insert([{ author_name: authorName, content: content, is_announcement: false }]);
      if (error) { alert("Error posting: " + error.message); btn.textContent = "Post to Forum"; btn.disabled = false; } else { document.getElementById('post-content').value = ""; btn.textContent = "Post to Forum"; btn.disabled = false; loadPosts(); }
    });
    document.getElementById('logout-btn').addEventListener('click', async () => { await supabaseClient.auth.signOut(); window.location.href = "index.html"; });
    document.getElementById('menu-toggle').addEventListener('click', () => { document.getElementById('navLinks').classList.toggle('active'); });
    document.addEventListener("DOMContentLoaded", loadPosts);
  </script>
</body>
</html>
