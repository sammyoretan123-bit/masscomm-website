<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/jpeg" href="images/mass communication logo.jpg" />
  <style>
    .dashboard-container { max-width: 1200px; margin: 40px auto; padding: 20px; }
    .welcome-banner { background: linear-gradient(135deg, #6a0dad 0%, #1a052b 100%); padding: 40px; border-radius: 12px; color: #fff; margin-bottom: 40px; overflow-wrap: break-word; }
    .welcome-banner h1 { margin: 0 0 10px; font-size: 2.5rem; }
    .welcome-banner p { margin: 0; color: #e0d4eb; font-size: 1.1rem; }
    .courses-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    
    .course-card { background: #fff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #6a0dad; display: flex; flex-direction: column; justify-content: space-between; transition: background-color 0.3s; }
    .course-card h3 { margin-top: 0; color: #0d0d0d; }
    .course-card p { font-size: 0.95rem; color: #666; }
    
    .progress-bar { background: #eee; border-radius: 10px; height: 10px; margin: 15px 0; overflow: hidden; }
    .progress-fill { background: #6a0dad; height: 100%; width: 0%; transition: width 0.3s; }
    .btn-continue { display: inline-block; background: #6a0dad; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; text-align: center; }
    .quiz-score-badge { display: inline-block; background: #1e7e34; color: #fff; padding: 3px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }

    .nav-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #6a0dad; vertical-align: middle; }

    /* --- DARK MODE FIXES --- */
    body.dark-mode .course-card { background-color: #1e1e1e !important; border-color: #333 !important; }
    body.dark-mode .course-card h3 { color: #ffffff !important; }
    body.dark-mode .course-card p { color: #bbbbbb !important; }
    body.dark-mode .course-card span { color: #bbbbbb !important; }
    body.dark-mode .progress-bar { background-color: #333333 !important; }
    body.dark-mode .page-title { color: #ffffff !important; }
    body.dark-mode .welcome-banner { background: linear-gradient(135deg, #3a0b5c 0%, #0d0214 100%) !important; }

    @media (max-width: 768px) {
      .welcome-banner h1 { font-size: 1.6rem; }
      .welcome-banner { padding: 25px; }
      .courses-grid { grid-template-columns: 1fr; }
      .menu-toggle { display: block !important; color: #fff; font-size: 28px; cursor: pointer; z-index: 1001; }
      .nav-links { display: none; flex-direction: column; position: absolute; top: 70px; right: 20px; background: #000; width: 200px; padding: 20px; border-radius: 8px; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
      .nav-links.active { display: flex !important; }
      .nav-links li { margin: 10px 0; text-align: right; }
    }
  </style>
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="images/mass communication logo.jpg" alt="Department Logo" />
        <span>Mass Communication AAUA</span>
      </div>
      
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html" style="color: #6a0dad; font-weight: bold;">My Dashboard</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="forum.html">Community</a></li>
        <li><a href="profile.html">My Profile</a></li>
        
        <!-- Admin Link (Hidden for students) -->
        <li id="admin-link-container" style="display: none;">
          <a href="admin.html" style="color: #e50914; font-weight: bold;">⚙️ Admin</a>
        </li>

        <li>
          <button id="theme-toggle" style="background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; padding: 0 10px;">🌙</button>
        </li>

        <li style="display: flex; align-items: center;">
          <a href="profile.html" style="padding: 0;">
            <img id="nav-avatar-img" src="images/mass communication logo.jpg" alt="Profile" class="nav-avatar" onerror="this.src='https://ui-avatars.com/api/?name=Student&background=6a0dad&color=fff';" />
          </a>
        </li>
        <li><button id="logout-btn" style="background: #e50914; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Log Out</button></li>
      </ul>
      
      <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    </nav>
  </header>

  <div class="dashboard-container">
    
    <div id="announcement-banner" style="display: none; background: #fff3cd; border-left: 5px solid #ffc107; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative;">
      <h4 id="ann-title" style="margin: 0 0 5px; color: #856404; font-size: 1.1rem;"></h4>
      <p id="ann-message" style="margin: 0; color: #856404;"></p>
      <button onclick="document.getElementById('announcement-banner').style.display='none'" style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #856404;">&times;</button>
    </div>

    <div class="welcome-banner">
      <h1>Welcome back, <span id="student-name">Student</span>!</h1>
      <p>Here are your enrolled courses and progress.</p>
    </div>

    <h2 style="margin-bottom: 20px;" class="page-title">My Courses</h2>
    <div class="courses-grid" id="courses-grid">
      <p>Loading courses...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    // --- DARK MODE LOGIC ---
    const themeToggleBtn = document.getElementById('theme-toggle');
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      if (themeToggleBtn) themeToggleBtn.textContent = '☀️';
    }
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        if (document.body.classList.contains('dark-mode')) {
          localStorage.setItem('theme', 'dark');
          themeToggleBtn.textContent = '☀️';
        } else {
          localStorage.setItem('theme', 'light');
          themeToggleBtn.textContent = '🌙';
        }
      });
    }

    // --- MAIN DASHBOARD LOGIC ---
    async function loadDashboard() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = "login.html"; return; }

      // Fetch Announcement
      const { data: announcements } = await supabaseClient
        .from('announcements')
        .select('*')
        .eq('is_active', true)
        .order('created_at', { ascending: false })
        .limit(1);

      if (announcements && announcements.length > 0) {
        const latestAnn = announcements[0];
        document.getElementById('ann-title').textContent = latestAnn.title;
        document.getElementById('ann-message').textContent = latestAnn.message;
        document.getElementById('announcement-banner').style.display = 'block';
      }

      // Fetch Profile (Now including role)
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('full_name, avatar_url, role')
        .eq('id', session.user.id)
        .single();

      if (profile && profile.full_name) {
        document.getElementById('student-name').textContent = profile.full_name;
      } else {
        document.getElementById('student-name').textContent = session.user.email.split('@')[0];
      }

      if (profile && profile.avatar_url) {
        document.getElementById('nav-avatar-img').src = profile.avatar_url;
      }

      // Show Admin Link if user is admin
      if (profile && profile.role === 'admin') {
        document.getElementById('admin-link-container').style.display = 'block';
      }

      // Fetch Courses
      const { data: courses, error: courseError } = await supabaseClient.from('courses').select('*');
      const grid = document.getElementById('courses-grid');
      
      if (courseError) {
        grid.innerHTML = `<p style="color: red;">Error loading courses: ${courseError.message}</p>`;
        return;
      }

      if (!courses || courses.length === 0) {
        grid.innerHTML = `<p>No courses available yet.</p>`;
        return;
      }

      let coursesHTML = '';
      for (let course of courses) {
        const { count: totalMaterials } = await supabaseClient
          .from('materials')
          .select('*', { count: 'exact', head: true })
          .eq('course_code', course.code);

        const { data: completed } = await supabaseClient
          .from('progress')
          .select('material_id')
          .eq('user_id', session.user.id);

        let completedCount = 0;
        if (completed && totalMaterials > 0) {
           const { data: courseMaterials } = await supabaseClient
             .from('materials')
             .select('id')
             .eq('course_code', course.code);
           
           if (courseMaterials) {
             const courseMaterialIds = courseMaterials.map(m => m.id);
             completedCount = completed.filter(p => courseMaterialIds.includes(p.material_id)).length;
           }
        }

        let percentage = totalMaterials > 0 ? Math.round((completedCount / totalMaterials) * 100) : 0;

        const { data: quizData } = await supabaseClient
          .from('quiz_scores')
          .select('score, total_questions')
          .eq('user_id', session.user.id)
          .eq('course_code', course.code)
          .order('score', { ascending: false })
          .limit(1);

        let quizBadge = '';
        if (quizData && quizData.length > 0) {
          const q = quizData[0];
          const qPercentage = Math.round((q.score / q.total_questions) * 100);
          quizBadge = `<span class="quiz-score-badge">Quiz: ${qPercentage}%</span>`;
        }

        coursesHTML += `
          <div class="course-card">
            <div>
              <h3>${course.title}</h3>
              <p>${course.description || 'Start learning today.'}</p>
              ${quizBadge}
            </div>
            <div>
              <div style="display:flex; justify-content:space-between; font-size: 0.8rem; margin-top:10px;">
                <span>${completedCount} of ${totalMaterials} lessons complete</span>
                <span>${percentage}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${percentage}%;"></div>
              </div>
              
              ${percentage === 100 ? `
                <a href="certificate.html?name=${profile && profile.full_name ? profile.full_name : session.user.email.split('@')[0]}&course=${course.title}" target="_blank" class="btn-continue" style="background: #1e7e34; margin-top: 5px;">🏆 Download Certificate</a>
              ` : ''}
              
              <a href="course-view.html?id=${course.id}" class="btn-continue" style="margin-left: 5px;">Continue Learning</a>
            </div>
          </div>
        `;
      }

      grid.innerHTML = coursesHTML;
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    });

    document.getElementById('menu-toggle').addEventListener('click', () => {
      document.getElementById('navLinks').classList.toggle('active');
    });

    document.addEventListener("DOMContentLoaded", loadDashboard);
  </script>
</body>
</html>
