<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login | NAMACOS</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0d0d0d; }
    .login-box { background: #fff; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .login-box h2 { color: #6a0dad; text-align: center; margin-top: 0; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .login-box button { width: 100%; padding: 12px; background: #6a0dad; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .login-box button:hover { background: #8e2de2; }
    #error-msg { color: #e50914; text-align: center; margin-top: 15px; display: none; }
  </style>
</head>
<body>

  <div class="login-box">
    <img src="images/mass communication logo.jpg" alt="Logo" style="width: 80px; display: block; margin: 0 auto 20px; border-radius: 50%;" />
    <h2>Student Portal Login</h2>
    <p style="text-align: center; color: #666; margin-bottom: 25px;">Log in to access your courses.</p>
    
    <form id="login-form">
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>
    <p id="error-msg"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Supabase Login
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        errorMsg.style.display = "block";
        errorMsg.textContent = error.message;
      } else {
        // Success! Redirect to dashboard
        window.location.href = "dashboard.html";
      }
    });
  </script>
</body>
</html>
